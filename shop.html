<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verba Vitae - Shop</title>
    <link rel="stylesheet" href="shop.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="shop-header">
        <!-- Top Utility Bar -->
        <div class="shop-top-bar">
            <div class="top-bar-links">
            </div>
        </div>

        <!-- Main Nav Bar -->
        <div class="shop-main-nav">
            <a href="index.html" class="shop-logo-link">
                <img src="verbavitaelogoblue.png" alt="Verba Vitae Logo" class="shop-logo">
            </a>

            <div class="search-container">
                <input type="text" placeholder="Search products, savings, or recipes">
                <button class="search-btn">🔍</button>
            </div>

            <div class="user-actions">
                <a href="#" class="action-link">
                    <span class="icon">🛒</span> Cart
                </a>
                <a href="login.html" class="btn-shop-login">Log in</a>
            </div>
        </div>

        <!-- Secondary Nav Bar -->
        <div class="shop-secondary-nav">
            <div class="secondary-links">
                <div class="dropdown">
                    <a href="#">Savings <span class="arrow">v</span></a>
                </div>
                <div class="dropdown">
                    <a href="#">Order ahead <span class="arrow">v</span></a>
                </div>
                <div class="dropdown">
                    <a href="#">Catering <span class="arrow">v</span></a>
                </div>
                <div class="dropdown">
                    <a href="#">Delivery & curbside <span class="icon-carrot">🥕</span></a>
                </div>
                <div class="dropdown">
                    <a href="#">Weekly ad</a>
                </div>
            </div>
        </div>
    </header>
    
    <main class="shop-content">
        <!-- Shop content will go here later -->
    </main>
</body>
</html>
