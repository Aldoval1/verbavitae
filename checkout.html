<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Verba Vitae Checkout - Complete your book and item reservation for in-store pickup.">
    <title>Verba Vitae - Checkout</title>
    <link rel="icon" type="image/png" href="images/verbavitaelogoblue.png">
    <link rel="stylesheet" href="css/shop.css">
    <link rel="stylesheet" href="css/checkout.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="js/firebase-init.js"></script>
</head>
<body>
    <header class="shop-header">
        <div class="shop-main-nav">
            <a href="index.html" class="shop-logo-link">
                <img src="images/verbavitaelogoblue.png" alt="Verba Vitae Logo" class="shop-logo">
            </a>
            <div class="user-actions">
                <a href="shop.html" class="action-link"><i class="fas fa-arrow-left"></i> Back to Shop</a>
            </div>
        </div>
    </header>
    
    <main class="checkout-content">
        <div class="checkout-header">
            <h1>Checkout</h1>
            <div id="checkoutTimer" class="checkout-timer">
                Loading timer...
            </div>
        </div>

        <div class="checkout-container">
            <!-- Left Side: Order Summary & Details -->
            <div class="checkout-left">
                <div class="customer-details">
                    <h2>Customer Details</h2>
                    <div class="form-group">
                        <label for="customerName">Full Name</label>
                        <input type="text" id="customerName" placeholder="e.g. John Doe" required>
                    </div>
                    <div class="form-group">
                        <label for="customerEmail">Email Address</label>
                        <input type="email" id="customerEmail" placeholder="e.g. john@example.com" required>
                    </div>
                </div>

                <div class="order-summary">
                    <h2>Order Summary</h2>
                    <div id="cartItemsList" class="cart-items-list">
                        <!-- Dynamic Cart Items Here -->
                    </div>
                    <div class="order-total">
                        <span>Total:</span>
                        <span id="orderTotalAmount">$0.00</span>
                    </div>
                </div>
            </div>

            <!-- Right Side: Payment Methods -->
            <div class="payment-methods">
                <h2>Payment Method</h2>
                <form id="checkoutForm">
                    <div class="payment-option">
                        <input type="radio" id="payCash" name="paymentMethod" value="cash" checked>
                        <label for="payCash">
                            Pay with Cash (In-Store Pickup)
                        </label>
                    </div>
                    
                    <div class="pickup-notice" id="pickupNotice">
                        <p><strong>Important:</strong> Products must be picked up within 1 week of placing the order. If not collected, the books will be released back to the store.</p>
                    </div>

                    <button type="button" class="place-order-btn" id="placeOrderBtn">Place Order</button>
                </form>
            </div>
        </div>
    </main>

    <script src="js/cart.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const cartItemsList = document.getElementById('cartItemsList');
            const orderTotalAmount = document.getElementById('orderTotalAmount');
            const checkoutTimer = document.getElementById('checkoutTimer');
            const placeOrderBtn = document.getElementById('placeOrderBtn');

            function escapeHtmlCheckout(str) {
                if (str === null || str === undefined) return '';
                return String(str)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            }

            function renderCart() {
                const cart = getCart();
                cartItemsList.innerHTML = '';

                if (cart.length === 0) {
                    cartItemsList.innerHTML = '<p class="empty-cart-msg">Your cart is empty.</p>';
                    orderTotalAmount.textContent = '$0.00';
                    placeOrderBtn.disabled = true;
                    checkoutTimer.style.display = 'none';
                    return;
                }

                placeOrderBtn.disabled = false;
                checkoutTimer.style.display = 'block';
                let total = 0;

                cart.forEach(item => {
                    const priceVal = parseFloat(String(item.price || '0').replace('$', '')) || 0;
                    total += priceVal;

                    const safeCategory = escapeHtmlCheckout(item.category || 'ITEM');
                    const safeTitle = escapeHtmlCheckout(item.title || '');
                    const safeAuthor = escapeHtmlCheckout(item.author || '');
                    const safeIsbn = escapeHtmlCheckout(item.isbn || '');
                    const safePrice = escapeHtmlCheckout(item.price || '$0.00');

                    const itemEl = document.createElement('div');
                    itemEl.className = 'cart-item';
                    itemEl.innerHTML = `
                        <div class="cart-item-cover">${safeCategory}</div>
                        <div class="cart-item-details">
                            <h3>${safeTitle}</h3>
                            <p>${safeAuthor}</p>
                            <p class="cart-item-isbn">ISBN: ${safeIsbn}</p>
                        </div>
                        <div class="cart-item-action">
                            <p class="cart-item-price">${safePrice}</p>
                            <button class="remove-btn" data-isbn="${safeIsbn}">Remove</button>
                        </div>
                    `;
                    cartItemsList.appendChild(itemEl);
                });

                orderTotalAmount.textContent = '$' + total.toFixed(2);

                // Add remove listeners
                document.querySelectorAll('.remove-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const isbn = e.target.getAttribute('data-isbn');
                        window.removeFromCart(isbn);
                        renderCart();
                    });
                });
            }

            // Timer logic
            function updateTimer() {
                const expiresAt = window.getCartExpirationTime();
                if (!expiresAt) {
                    checkoutTimer.textContent = 'Cart is empty or expired.';
                    return;
                }

                const now = Date.now();
                const diff = expiresAt - now;

                if (diff <= 0) {
                    renderCart(); 
                    return;
                }

                const minutes = Math.floor(diff / 60000);
                const seconds = Math.floor((diff % 60000) / 1000);
                
                checkoutTimer.textContent = `Time remaining: ${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
                checkoutTimer.style.color = minutes < 5 ? '#e53e3e' : '#2d3748';
            }

            renderCart();
            updateTimer();
            setInterval(updateTimer, 1000);

            // Place Order
            placeOrderBtn.addEventListener('click', () => {
                const name = document.getElementById('customerName').value.trim();
                const email = document.getElementById('customerEmail').value.trim();

                if (!name || !email) {
                    alert('Please enter your Full Name and Email Address so we can send the invoice.');
                    return;
                }

                placeOrderBtn.textContent = 'Sending Invoice...';
                placeOrderBtn.disabled = true;

                const orderId = "ORD-" + Date.now().toString(36).toUpperCase() + "-" + Math.floor(1000 + Math.random() * 9000);
                const cart = getCart();
                let total = 0;
                const ordersParams = cart.map(item => {
                    const priceVal = parseFloat(String(item.price || '0').replace('$', '')) || 0;
                    total += priceVal;
                    return {
                        name: item.title + ' (by ' + item.author + ')',
                        price: priceVal.toFixed(2),
                        units: 1
                    };
                });

                const templateParams = {
                    order_id: orderId,
                    to_name: name,
                    to_email: email,
                    orders: ordersParams,
                    cost: {
                        shipping: "0.00",
                        tax: "0.00",
                        total: total.toFixed(2)
                    }
                };

                if (typeof emailjs !== 'undefined' && emailjs) {
                    emailjs.send("service_7v4lwfn", "template_o63ti47", templateParams, "T2RRIBrs9d6zqacLR")
                        .then(() => {
                            completeOrderSuccess(orderId);
                        })
                        .catch((error) => {
                            console.error('EmailJS Error:', error);
                            alert('There was an error sending the email, but your order was still reserved.');
                            completeOrderSuccess(orderId);
                        });
                } else {
                    completeOrderSuccess(orderId);
                }
            });

            async function completeOrderSuccess(orderId) {
                const finalOrderId = orderId || ("ORD-" + Date.now().toString(36).toUpperCase() + "-" + Math.floor(1000 + Math.random() * 9000));
                const cart = getCart();

                // Save order to E-Board & Admin Dashboards
                const name = document.getElementById('customerName').value.trim();
                const email = document.getElementById('customerEmail').value.trim();
                let total = 0;
                const itemsForOrder = cart.map(item => {
                    const itemPrice = parseFloat(String(item.price || '0').replace('$', '')) || 0;
                    total += itemPrice;
                    return { title: item.title, isbn: item.isbn, price: itemPrice, quantity: 1 };
                });
                
                const nowIso = new Date().toISOString();
                const newOrder = {
                    id: finalOrderId,
                    customerName: name,
                    customerEmail: email,
                    total: total,
                    items: itemsForOrder,
                    status: 'Pending',
                    date: nowIso,
                    timestamp: nowIso
                };
                
                const orders = JSON.parse(localStorage.getItem('verba_orders')) || [];
                orders.push(newOrder);
                localStorage.setItem('verba_orders', JSON.stringify(orders));

                if (typeof db !== 'undefined' && db) {
                    try {
                        await db.collection('orders').doc(finalOrderId).set(newOrder);
                    } catch (err) {
                        console.warn('Firestore order save warning:', err);
                    }
                }

                const purchasedStr = localStorage.getItem('verba_purchased');
                const purchased = purchasedStr ? JSON.parse(purchasedStr) : [];
                cart.forEach(item => {
                    if (!purchased.includes(item.isbn)) {
                        purchased.push(item.isbn);
                    }
                });
                localStorage.setItem('verba_purchased', JSON.stringify(purchased));

                localStorage.removeItem('verba_cart');
                localStorage.removeItem('verba_cart_expires');
                alert(`Your order (${finalOrderId}) has been reserved! Please pick up your items within 1 week.`);
                window.location.href = 'shop.html';
            }
        });
    </script>
</body>
</html>
