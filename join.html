<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Join Verba Vitae">
    <title>Verba Vitae - Join Now</title>
    <link rel="icon" type="image/png" href="images/verbavitaelogoblue.png">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="js/firebase-init.js"></script>
</head>
<body class="join-page">
    <div style="background-color: #ff9800; color: #fff; text-align: center; padding: 10px; font-weight: bold; z-index: 10000; position: relative; width: 100%;">This page is currently under development and will be ready by August 6, 2026.</div>

    <div class="join-wrapper">
        <a href="index.html" class="back-home"><i class="fas fa-arrow-left"></i> Back to Home</a>
        
        <div class="join-container">
            <div class="join-form-section">
                <div class="join-header-row">
                    <img src="images/verbavitaelogoblue.png" alt="Verba Vitae Logo" class="join-logo-new">
                    <div class="join-header-text">
                        <h2 class="join-title-new">VERBA VITAE</h2>
                        <p class="join-subtitle-new">ORGANIZATION</p>
                    </div>
                </div>
                <hr class="join-divider">

                <!-- STEP 1: Code Verification -->
                <div id="step-1" class="join-step">
                    <p class="join-instruction">Enter your invitation code or email address to continue.</p>
                    <div class="input-group">
                        <div class="label-row">
                            <label for="invite-code">Invitation Code / Email</label>
                        </div>
                        <input type="text" id="invite-code" class="input-new" placeholder="" autocomplete="off">
                        <div id="code-error" class="error-msg" style="display: none;">Invalid code or email. Please try again.</div>
                    </div>
                    <div class="btn-row">
                        <button id="btn-verify" class="btn-join-new">Continue</button>
                    </div>
                </div>

                <!-- STEP 2: Registration Info -->
                <div id="step-2" class="join-step" style="display: none; opacity: 0;">
                    <p class="join-instruction">Please complete your profile information.</p>
                    
                    <div class="form-row">
                        <div class="input-group half">
                            <label for="first-name">First Name</label>
                            <input type="text" id="first-name" class="input-new" placeholder="">
                        </div>
                        <div class="input-group half">
                            <label for="last-name">Last Name</label>
                            <input type="text" id="last-name" class="input-new" placeholder="">
                        </div>
                    </div>
                    
                    <div class="input-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" class="input-new" placeholder="">
                    </div>

                    <div class="input-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" class="input-new" placeholder="">
                    </div>

                    <div class="input-group">
                        <label for="major">Major / Program</label>
                        <input type="text" id="major" class="input-new" placeholder="">
                    </div>

                    <div class="input-group">
                        <label for="password">Create Password</label>
                        <input type="password" id="password" class="input-new" placeholder="">
                    </div>

                    <div class="btn-row">
                        <button id="btn-register" class="btn-join-new">Complete Registration</button>
                    </div>
                </div>
            </div>
            
            <div class="join-bottom-section">
                <!-- Space for future elements or images -->
            </div>
        </div>
    </div>

    <script>
        const btnVerify = document.getElementById('btn-verify');
        const inviteCodeInput = document.getElementById('invite-code');
        const codeError = document.getElementById('code-error');
        const step1 = document.getElementById('step-1');
        const step2 = document.getElementById('step-2');
        const btnRegister = document.getElementById('btn-register');

        btnVerify.addEventListener('click', () => {
            const val = inviteCodeInput.value.trim().toLowerCase();
            // Accept 'testing' or any dynamically generated code (length >= 8)
            if (val === 'testing' || val.length >= 8) {
                codeError.style.display = 'none';
                
                // Fade out step 1
                step1.style.opacity = '0';
                setTimeout(() => {
                    step1.style.display = 'none';
                    
                    // Fade in step 2
                    step2.style.display = 'block';
                    // Trigger reflow for animation
                    void step2.offsetWidth; 
                    step2.style.opacity = '1';
                }, 300);
            } else {
                codeError.style.display = 'block';
            }
        });

        // Trigger verify on Enter key
        inviteCodeInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                btnVerify.click();
            }
        });

        btnRegister.addEventListener('click', async () => {
            const firstName = document.getElementById('first-name').value.trim();
            const lastName = document.getElementById('last-name').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const major = document.getElementById('major').value.trim();
            const password = document.getElementById('password').value;
            const code = inviteCodeInput.value.trim();

            if (!firstName || !lastName || !email || !password) {
                alert('Please fill out all required fields (First Name, Last Name, Email, Password).');
                return;
            }

            btnRegister.textContent = 'Registering...';
            btnRegister.disabled = true;

            try {
                // 1. Create User in Firebase Auth
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                const user = userCredential.user;

                // 2. Save User Data in Firestore
                await db.collection('users').doc(user.uid).set({
                    firstName: firstName,
                    lastName: lastName,
                    email: email,
                    phone: phone,
                    major: major,
                    invitationCode: code,
                    role: 'member', // Default role
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                alert('Registration completed! Welcome to Verba Vitae.');
                window.location.href = 'index.html';
            } catch (error) {
                console.error("Error registering user:", error);
                alert('Error: ' + error.message);
                btnRegister.textContent = 'Complete Registration';
                btnRegister.disabled = false;
            }
        });

        // Check for URL parameter ?code=...
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const codeParam = urlParams.get('code');
            if (codeParam) {
                inviteCodeInput.value = codeParam;
            }
        });
    </script>
</body>
</html>
