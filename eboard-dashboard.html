<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verba Vitae - E-Board Admin Console</title>
    <link rel="icon" type="image/png" href="images/verbavitaelogoblue.png">
    <link rel="stylesheet" href="css/eboard-dashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div style="background-color: #ff9800; color: #fff; text-align: center; padding: 10px; font-weight: bold; z-index: 10000; position: relative; width: 100%;">This page is currently under development and will be ready by August 6, 2026.</div>
    <!-- Top Nav -->
    <header class="dash-header">
        <div class="dash-logo">
            <img src="images/verbavitaelogoblue.png" alt="Verba Vitae">
            <span>Verba Vitae E-Board Console</span>
        </div>
        <div class="dash-profile">
            <div class="profile-pic">
                <img src="images/cover1.png" alt="Profile" id="navProfilePic">
            </div>
            <a href="dashboard.html" class="config-link" title="Return to User Dashboard" style="display: flex; align-items: center; color: var(--text-muted); transition: color 0.3s; padding: 5px;">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
            </a>
        </div>
    </header>

    <main class="dash-main">
        <div class="admin-grid">
            
            <!-- Event Manager Section -->
            <section class="admin-card">
                <h2>Add Calendar Event</h2>
                <form id="eventForm" class="admin-form">
                    <div class="form-group">
                        <label for="eventTitle">Event Title</label>
                        <input type="text" id="eventTitle" required placeholder="e.g. Monthly Meeting">
                    </div>
                    <div class="form-group">
                        <label for="eventDate">Date</label>
                        <input type="date" id="eventDate" required>
                    </div>
                    <div class="form-group">
                        <label for="eventColor">Category Color</label>
                        <select id="eventColor" required>
                            <option value="blue">Blue (General)</option>
                            <option value="green">Green (Important)</option>
                            <option value="purple">Purple (Study Group)</option>
                        </select>
                    </div>
                    <button type="submit" class="admin-btn">Add Event</button>
                </form>
            </section>

            <!-- Shop Manager Section -->
            <section class="admin-card">
                <h2>Add Shop Product</h2>
                <form id="productForm" class="admin-form">
                    <div class="form-group">
                        <label for="productName">Product Name</label>
                        <input type="text" id="productName" required placeholder="e.g. Advanced Calculus Book">
                    </div>
                    <div class="form-group">
                        <label for="productCategory">Category (Page)</label>
                        <select id="productCategory" required>
                            <option value="books">Books (shop.html)</option>
                            <option value="accessories">Accessories</option>
                            <option value="snacks">Snacks</option>
                            <option value="technology">Technology</option>
                        </select>
                    </div>
                    <div id="bookExtraFields" style="border-left: 3px solid var(--accent-color); padding-left: 15px; margin-bottom: 20px;">
                        <div class="form-group">
                            <label for="bookSubCategory">Sub-category</label>
                            <input type="text" id="bookSubCategory" placeholder="e.g. Fantasy, Romance">
                        </div>
                        <div class="form-group" style="display: flex; gap: 15px;">
                            <div style="flex: 1;">
                                <label for="bookCondition">Condition</label>
                                <select id="bookCondition">
                                    <option value="New">New</option>
                                    <option value="Like New">Like New</option>
                                    <option value="Good">Good</option>
                                    <option value="Fair">Fair</option>
                                </select>
                            </div>
                            <div style="flex: 1;">
                                <label for="bookPages">Pages</label>
                                <input type="number" id="bookPages" placeholder="e.g. 350">
                            </div>
                        </div>
                        <div class="form-group" style="display: flex; gap: 15px;">
                            <div style="flex: 1;">
                                <label for="bookISBN">ISBN</label>
                                <input type="text" id="bookISBN" placeholder="e.g. 978-...">
                            </div>
                            <div style="flex: 1;">
                                <label for="bookPublisher">Publisher</label>
                                <input type="text" id="bookPublisher" placeholder="e.g. Penguin">
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="bookSynopsis">Synopsis</label>
                            <textarea id="bookSynopsis" rows="3" style="width: 100%; padding: 12px; border: 1px solid var(--border-color); font-family: inherit; resize: vertical;" placeholder="A brief summary..."></textarea>
                        </div>
                        <div class="form-group">
                            <label for="bookGoodreads">Goodreads Link (Optional)</label>
                            <input type="url" id="bookGoodreads" placeholder="https://www.goodreads.com/book/show/...">
                            <small style="color: var(--text-muted); display: block; margin-top: 5px;">We'll try to fetch the rating automatically!</small>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="productPrice">Price ($)</label>
                        <input type="number" id="productPrice" step="0.01" required placeholder="25.00">
                    </div>
                    <div class="form-group">
                        <label for="productImage">Image URL</label>
                        <input type="text" id="productImage" required placeholder="https://example.com/image.jpg">
                    </div>
                    <button type="submit" class="admin-btn">Add Product to Store</button>
                </form>
            </section>

            <!-- Pending Orders Section -->
            <section class="admin-card orders-section">
                <h2>Pending Receipts</h2>
                <div id="ordersList" class="orders-list">
                    <!-- Orders will be injected here via JS -->
                    <p class="empty-state">No pending orders at this time.</p>
                </div>
            </section>
        </div>
    </main>

    <!-- Global Toast Container -->
    <div id="toastContainer" class="toast-container"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Protect Route
            const isLoggedIn = localStorage.getItem('verba_logged_in');
            if (typeof auth !== 'undefined' && auth) {
                auth.onAuthStateChanged((user) => {
                    if (!user && isLoggedIn !== 'true') {
                        window.location.href = 'login.html';
                    }
                });
            } else if (isLoggedIn !== 'true') {
                window.location.href = 'login.html';
            }

            // Toast Notification System
            function showToast(message) {
                const container = document.getElementById('toastContainer');
                const toast = document.createElement('div');
                toast.className = 'toast';
                toast.textContent = message;
                container.appendChild(toast);
                setTimeout(() => {
                    toast.classList.add('fade-out');
                    setTimeout(() => toast.remove(), 300);
                }, 3000);
            }

            // --- Event Manager Logic ---
            const eventForm = document.getElementById('eventForm');
            eventForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const title = document.getElementById('eventTitle').value;
                const date = document.getElementById('eventDate').value;
                const color = document.getElementById('eventColor').value;
                
                const events = JSON.parse(localStorage.getItem('verba_events')) || [];
                events.push({ title, date, color });
                localStorage.setItem('verba_events', JSON.stringify(events));
                
                showToast('Event added successfully!');
                eventForm.reset();
            });

            // --- Shop Manager Logic ---
            const productForm = document.getElementById('productForm');
            const catSelect = document.getElementById('productCategory');
            const bookFields = document.getElementById('bookExtraFields');
            const submitBtn = productForm.querySelector('button[type="submit"]');

            catSelect.addEventListener('change', (e) => {
                if (e.target.value === 'books') {
                    bookFields.style.display = 'block';
                } else {
                    bookFields.style.display = 'none';
                }
            });

            productForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                submitBtn.disabled = true;
                submitBtn.textContent = 'Processing...';

                const name = document.getElementById('productName').value;
                const category = document.getElementById('productCategory').value;
                const price = document.getElementById('productPrice').value;
                const image = document.getElementById('productImage').value;
                
                let productData = { id: Date.now(), name, category, price, image };

                if (category === 'books') {
                    productData.subCategory = document.getElementById('bookSubCategory').value;
                    productData.condition = document.getElementById('bookCondition').value;
                    productData.pages = document.getElementById('bookPages').value;
                    productData.isbn = document.getElementById('bookISBN').value;
                    productData.publisher = document.getElementById('bookPublisher').value;
                    productData.synopsis = document.getElementById('bookSynopsis').value;
                    productData.goodreadsLink = document.getElementById('bookGoodreads').value;
                    productData.rating = null;

                    if (productData.goodreadsLink) {
                        submitBtn.textContent = 'Fetching Rating...';
                        try {
                            const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(productData.goodreadsLink)}`;
                            const response = await fetch(proxyUrl);
                            if (response.ok) {
                                const data = await response.json();
                                const html = data.contents;
                                let match = html.match(/class="RatingStatistics__rating">([\d.]+)<\/div>/);
                                if (!match) match = html.match(/<span itemprop="ratingValue">([\d.]+)<\/span>/);
                                if (!match) match = html.match(/Rating ([\d.]+) out of 5/);
                                if (!match) match = html.match(/aria-label="([\d.]+) out of 5/);
                                
                                if (match && match[1]) {
                                    productData.rating = match[1];
                                    showToast('Fetched Goodreads rating: ' + productData.rating);
                                } else {
                                    productData.rating = prompt("Could not fetch rating automatically. Enter rating manually (e.g. 4.28):", "4.00") || "4.00";
                                }
                            } else {
                                productData.rating = prompt("Proxy error fetching rating. Enter manually:", "4.00") || "4.00";
                            }
                        } catch(err) {
                            productData.rating = prompt("Network error. Enter rating manually:", "4.00") || "4.00";
                        }
                    }
                }
                
                const products = JSON.parse(localStorage.getItem('verba_products')) || [];
                products.push(productData);
                localStorage.setItem('verba_products', JSON.stringify(products));
                
                showToast('Product added successfully!');
                productForm.reset();
                if (catSelect.value === 'books') bookFields.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Add Product to Store';
            });

            // --- Orders Logic ---
            function loadOrders() {
                const ordersList = document.getElementById('ordersList');
                const orders = JSON.parse(localStorage.getItem('verba_orders')) || [];
                
                if (orders.length === 0) {
                    ordersList.innerHTML = '<p class="empty-state">No pending orders at this time.</p>';
                    return;
                }

                ordersList.innerHTML = '';
                orders.forEach((order, index) => {
                    const orderCard = document.createElement('div');
                    orderCard.className = 'order-card';
                    
                    let itemsHtml = order.items.map(item => `<li>${item.quantity}x ${item.title}</li>`).join('');
                    
                    orderCard.innerHTML = `
                        <div class="order-header">
                            <h4>${order.customerName}</h4>
                            <span class="order-total">$${parseFloat(order.total).toFixed(2)}</span>
                        </div>
                        <p class="order-email">${order.customerEmail}</p>
                        <p class="order-date">${new Date(order.date).toLocaleString()}</p>
                        <ul class="order-items">${itemsHtml}</ul>
                        <button class="admin-btn resolve-btn" data-index="${index}">Mark as Resolved</button>
                    `;
                    ordersList.appendChild(orderCard);
                });

                // Attach resolve events
                document.querySelectorAll('.resolve-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const index = e.target.getAttribute('data-index');
                        orders.splice(index, 1);
                        localStorage.setItem('verba_orders', JSON.stringify(orders));
                        loadOrders();
                        showToast('Order resolved!');
                    });
                });
            }

            loadOrders();
        });
    </script>
</body>
</html>
