<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Welcome to Verba Vitae">
    <title>Verba Vitae - Welcome</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="glass-panel">
            <div class="content">
                <h1 class="title">Verba Vitae</h1>
                <p class="subtitle">The system is online and ready.</p>
                
                <div class="status-indicator">
                    <div class="pulse-ring"></div>
                    <div class="pulse-dot"></div>
                    <span class="status-text">All systems operational</span>
                </div>

                <div class="button-group">
                    <button class="btn primary-btn">Get Started</button>
                    <button class="btn secondary-btn">View Documentation</button>
                </div>
            </div>
        </div>
        
        <div class="background-orbs">
            <div class="orb orb-1"></div>
            <div class="orb orb-2"></div>
            <div class="orb orb-3"></div>
        </div>
    </div>
</body>
</html>
