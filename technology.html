<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Verba Vitae Shop - Student technology, e-readers, and study devices.">
    <title>Verba Vitae - Technology</title>
    <link rel="icon" type="image/png" href="images/verbavitaelogoblue.png">
    <link rel="stylesheet" href="css/shop.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="js/firebase-init.js"></script>
</head>
<body>
    <header class="shop-header">
        <!-- Top Utility Bar -->
        <div class="shop-top-bar">
            <div class="top-bar-links">
                <a href="index.html"><i class="fas fa-home"></i> Home</a>
                <a href="voice.html"><i class="fas fa-comments"></i> Verba Voice</a>
            </div>
        </div>

        <!-- Main Nav Bar -->
        <div class="shop-main-nav">
            <a href="index.html" class="shop-logo-link">
                <img src="images/verbavitaelogoblue.png" alt="Verba Vitae Logo" class="shop-logo">
            </a>

            <div class="search-container">
                <input type="text" id="categorySearch" placeholder="Search products, savings, or recipes">
                <button class="search-btn" aria-label="Search"><i class="fas fa-search"></i></button>
            </div>

            <div class="user-actions">
                <a href="checkout.html" class="action-link" id="navCart">
                    <span class="icon"><i class="fas fa-shopping-cart"></i></span> Cart (<span id="cartCount">0</span>)
                </a>
                <a href="login.html" class="btn-shop-login">Log in</a>
            </div>
        </div>

        <!-- Secondary Nav Bar -->
        <div class="shop-secondary-nav">
            <div class="secondary-links">
                <div class="dropdown">
                    <a href="shop.html">Books <span class="arrow"><i class="fas fa-chevron-down" style="font-size: 0.7rem;"></i></span></a>
                </div>
                <div class="dropdown active">
                    <a href="technology.html">Technology <span class="arrow"><i class="fas fa-chevron-down" style="font-size: 0.7rem;"></i></span></a>
                </div>
                <div class="dropdown">
                    <a href="snacks.html">Snacks <span class="arrow"><i class="fas fa-chevron-down" style="font-size: 0.7rem;"></i></span></a>
                </div>
                <div class="dropdown">
                    <a href="accessories.html">Accessories <span class="arrow"><i class="fas fa-chevron-down" style="font-size: 0.7rem;"></i></span></a>
                </div>
            </div>
        </div>
    </header>
    
    <main class="shop-content">
        <section class="search-results" style="width: 100%; padding: 40px;">
            <h2>Technology</h2>
            <div class="results-grid">
                <!-- Custom products will be injected here -->
            </div>
        </section>
    </main>

    <!-- Product Details Modal -->
    <div class="modal-overlay" id="bookModal">
        <div class="modal-content">
            <button class="close-modal">&times;</button>
            <div class="modal-body">
                <div class="modal-left">
                    <div class="modal-cover" id="modalCover">
                        <!-- Populated by JS -->
                    </div>
                </div>
                <div class="modal-right">
                    <h2 id="modalTitle">Product</h2>
                    <p class="modal-author" id="modalAuthor"></p>
                    <p class="modal-price" id="modalPrice">$0.00</p>
                    <div class="modal-details">
                        <!-- Populated by JS -->
                    </div>
                    <div class="modal-synopsis">
                        <!-- Populated by JS -->
                    </div>
                    <div class="modal-links">
                        <!-- Populated by JS -->
                    </div>
                    <button class="add-to-cart-btn">Add to Cart</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/cart.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof auth !== 'undefined' && auth) {
                auth.onAuthStateChanged(user => {
                    const loginBtn = document.querySelector('.btn-shop-login');
                    if (loginBtn && user) {
                        loginBtn.textContent = 'Account';
                        loginBtn.href = 'dashboard.html';
                    }
                });
            }

            const searchInput = document.querySelector('.search-container input');
            const grid = document.querySelector('.results-grid');

            function filterCategoryItems() {
                const query = searchInput ? searchInput.value.toLowerCase().trim() : '';
                const cards = document.querySelectorAll('.results-grid .book-card');
                let visibleCount = 0;

                cards.forEach(card => {
                    const titleText = card.querySelector('.book-title') ? card.querySelector('.book-title').textContent.toLowerCase() : '';
                    const authorText = card.querySelector('.book-author') ? card.querySelector('.book-author').textContent.toLowerCase() : '';
                    const isbnText = card.querySelector('.book-isbn') ? card.querySelector('.book-isbn').textContent.toLowerCase() : '';
                    const matchesSearch = !query || titleText.includes(query) || authorText.includes(query) || isbnText.includes(query);

                    if (matchesSearch && !card.classList.contains('in-cart') && !card.classList.contains('purchased')) {
                        card.style.display = 'flex';
                        visibleCount++;
                    } else {
                        card.style.display = 'none';
                    }
                });

                let emptyMessage = document.querySelector('.empty-message');
                if (visibleCount === 0 && grid) {
                    if (!emptyMessage) {
                        emptyMessage = document.createElement('div');
                        emptyMessage.className = 'empty-message';
                        emptyMessage.style.gridColumn = '1 / -1';
                        emptyMessage.style.textAlign = 'center';
                        emptyMessage.style.padding = '40px 0';
                        emptyMessage.style.color = '#718096';
                        emptyMessage.style.fontSize = '1.1rem';
                        grid.appendChild(emptyMessage);
                    }
                    emptyMessage.textContent = query ? 'No technology items match your search.' : 'No technology items currently available.';
                    emptyMessage.style.display = 'block';
                } else if (emptyMessage) {
                    emptyMessage.style.display = 'none';
                }
            }

            window.triggerFilterBooks = filterCategoryItems;
            if (searchInput) {
                searchInput.addEventListener('input', filterCategoryItems);
            }
            filterCategoryItems();

            // Modal logic
            const modal = document.getElementById('bookModal');
            const closeModalBtn = document.querySelector('.close-modal');
            if (closeModalBtn && modal) {
                closeModalBtn.addEventListener('click', () => {
                    modal.style.display = 'none';
                });
            }
            window.addEventListener('click', (e) => {
                if (e.target === modal) {
                    modal.style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
