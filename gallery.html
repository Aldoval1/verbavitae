<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Welcome to Verba Vitae">
    <title>Verba Vitae - Gallery</title>
    <link rel="icon" type="image/png" href="images/verbavitaelogoblue.png">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome for Social Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <!-- Note: We only need firestore to read public albums, no auth/storage needed for viewing -->
    <script src="js/firebase-init.js"></script>
</head>
<body>
    <header class="main-header">
        
        <!-- Mobile Header (Visible only on mobile) -->
        <div class="mobile-header-bar">
            <div class="burger-menu" id="burger-menu">
                <i class="fas fa-bars"></i>
            </div>
            <div class="mobile-logo-container">
                <img src="images/verbavitaelogoblue.png" alt="Verba Vitae" class="mobile-logo-img">
                <span class="mobile-logo-text">VERBA VITAE</span>
            </div>
        </div>
        
        <!-- Mobile Navigation Menu -->
        <div class="mobile-nav" id="mobile-nav">
            <a href="login.html">Log In</a>
            <a href="join.html">Join</a>
            <a href="eboard.html">Our E-Board</a>
            <a href="#">Opportunities</a>
            <a href="#">News</a>
            <a href="#">Events</a>
            <a href="shop.html">Shop</a>
        </div>

        <!-- Desktop Navigation (Visible only on desktop) -->
        <div class="desktop-nav">
            <div class="top-bar">
                <div class="nav-links left-links">
                </div>
                <div class="nav-links right-links" style="justify-content: flex-end; padding-right: 5%;">
                    <a href="login.html" class="btn-login">LOG IN</a>
                </div>
            </div>
            
            <div class="secondary-bar">
                <div class="nav-links left-links">
                    <a href="join.html">Join</a>
                    <span class="divider">|</span>
                    <a href="eboard.html">Our E-Board</a>
                    <span class="divider">|</span>
                    <a href="#">Opportunities</a>
                </div>
                <div class="nav-links right-links">
                    <a href="#">News</a>
                    <span class="divider">|</span>
                    <a href="#">Events</a>
                    <span class="divider">|</span>
                    <a href="shop.html">Shop</a>
                </div>
            </div>
        </div>
    </header>



    <!-- Dynamic Gallery Section -->
    <section class="gallery-section" id="gallery-section">
        <h2 class="about-title">ALBUM GALLERY</h2>
        <div class="gallery-grid" id="publicGalleryGrid">
            <!-- Albums will be dynamically injected here -->
        </div>
    </section>

    <footer class="main-footer">
        <div class="footer-container">
            <div class="footer-left">
                <img src="images/verbavitaelogoblue.png" alt="Verba Vitae" class="footer-logo">
            </div>
            
            <div class="footer-center">
                <h4 class="footer-social-title">FOLLOW US</h4>
                <div class="social-icons">
                    <a href="#"><i class="fab fa-facebook-f"></i></a>
                    <a href="#"><i class="fab fa-instagram"></i></a>
                    <a href="#"><i class="fab fa-youtube"></i></a>
                    <a href="#"><i class="fa-brands fa-x-twitter"></i></a>
                    <a href="#"><i class="fab fa-linkedin-in"></i></a>
                    <a href="#"><i class="fab fa-tiktok"></i></a>
                </div>
                <div class="footer-links">
                    &copy; Copyright 2026 Verba Vitae | <a href="#">Privacy Policy</a> | <a href="#">Membership Terms and Conditions</a>
                </div>
            </div>

            <div class="footer-right"></div>
        </div>
    </footer>

    <script>
        // Burger Menu Toggle
        const burgerMenu = document.getElementById('burger-menu');
        const mobileNav = document.getElementById('mobile-nav');
        
        burgerMenu.addEventListener('click', () => {
            mobileNav.classList.toggle('active');
        });



        // Fetch Public Albums
        async function fetchAlbums() {
            const grid = document.getElementById('publicGalleryGrid');
            if (!grid) return;
            
            try {
                const snapshot = await db.collection('albums').orderBy('createdAt', 'desc').get();
                if (snapshot.empty) {
                    grid.innerHTML = '<p class="no-events" style="grid-column: 1 / -1;">No albums available at the moment.</p>';
                    return;
                }
                
                let html = '';
                snapshot.forEach(doc => {
                    const data = doc.data();
                    html += `
                        <div class="gallery-album-card" onclick="openPhotoViewer('${doc.id}', '${data.title.replace(/'/g, "\\'")}')" style="cursor:pointer;">
                            <img src="${data.coverUrl}" alt="${data.title}" class="album-cover">
                            <div class="album-overlay">
                                <h3 class="album-title">${data.title}</h3>
                            </div>
                        </div>
                    `;
                });
                grid.innerHTML = html;
            } catch (error) {
                console.error("Error fetching albums:", error);
                grid.innerHTML = '<p style="color:red; grid-column: 1 / -1;">Failed to load gallery.</p>';
            }
        }

        document.addEventListener('DOMContentLoaded', fetchAlbums);

        // --- Photo Viewer Modal ---
        window.openPhotoViewer = async function(albumId, title) {
            const modal = document.getElementById('photoViewerModal');
            const titleEl = document.getElementById('photoViewerTitle');
            const grid = document.getElementById('photoViewerGrid');
            
            titleEl.textContent = title;
            grid.innerHTML = '<p style="color:white; text-align:center; grid-column:1/-1;">Loading photos...</p>';
            modal.style.display = 'flex';

            try {
                const doc = await db.collection('albums').doc(albumId).get();
                const photos = doc.data().photos || [];

                if (photos.length === 0) {
                    grid.innerHTML = '<p style="color:white; text-align:center; grid-column:1/-1;">No photos in this album yet.</p>';
                    return;
                }

                let html = '';
                photos.forEach(url => {
                    html += `
                        <div style="width:100%; aspect-ratio:1; border-radius:8px; overflow:hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.3);">
                            <img src="${url}" style="width:100%; height:100%; object-fit:cover; transition: transform 0.3s ease;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
                        </div>
                    `;
                });
                grid.innerHTML = html;
            } catch (error) {
                console.error("Error loading photos:", error);
                grid.innerHTML = '<p style="color:red; text-align:center; grid-column:1/-1;">Failed to load photos.</p>';
            }
        };

        window.closePhotoViewer = function() {
            document.getElementById('photoViewerModal').style.display = 'none';
        };
    </script>

    <!-- Photo Viewer Modal HTML -->
    <div id="photoViewerModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:99999; flex-direction:column; padding:20px; overflow-y:auto;">
        <button onclick="closePhotoViewer()" style="position:fixed; top:20px; right:30px; background:none; border:none; color:white; font-size:3rem; cursor:pointer; z-index:100000;">&times;</button>
        <h2 id="photoViewerTitle" style="color:white; text-align:center; margin-top:20px; margin-bottom:40px; font-size:2rem; letter-spacing:2px; font-weight:700;"></h2>
        <div id="photoViewerGrid" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(250px, 1fr)); gap:20px; max-width:1200px; width:100%; margin:0 auto; padding-bottom:50px;">
            <!-- Photos go here -->
        </div>
    </div>
</body>
</html>
