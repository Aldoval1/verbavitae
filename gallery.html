    <script>
        // Burger Menu Toggle
        const burgerMenu = document.getElementById('burger-menu');
        const mobileNav = document.getElementById('mobile-nav');
        
        if (burgerMenu && mobileNav) {
            burgerMenu.addEventListener('click', () => {
                mobileNav.classList.toggle('active');
            });
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function sanitizeUrl(url) {
            if (!url || typeof url !== 'string') return '';
            const trimmed = url.trim();
            if (/^https?:\/\//i.test(trimmed) || /^data:image\//i.test(trimmed) || /^[a-zA-Z0-9_./-]+$/.test(trimmed)) {
                return trimmed;
            }
            return '';
        }

        function showEmptyState() {
            const grid = document.getElementById('publicGalleryGrid');
            if (grid) {
                grid.innerHTML = '<p class="no-events" style="grid-column: 1 / -1; text-align: center; padding: 40px; color: #666; font-size: 1.1rem;">No albums available at the moment.</p>';
            }
        }

        function renderAlbumCards(albums) {
            const grid = document.getElementById('publicGalleryGrid');
            if (!grid) return;

            if (!albums || albums.length === 0) {
                showEmptyState();
                return;
            }

            let html = '';
            albums.forEach(data => {
                const cover = sanitizeUrl(data.coverUrl) || 'images/verbavitaelogoblue.png';
                const title = data.title || 'Untitled Album';
                html += `
                    <a href="album.html?id=${encodeURIComponent(data.id)}" class="gallery-album-card" style="text-decoration:none; color:inherit; display:block; cursor:pointer;">
                        <img src="${escapeHtml(cover)}" alt="${escapeHtml(title)}" class="album-cover" loading="lazy" onerror="this.onerror=null; this.src='images/verbavitaelogoblue.png';">
                        <div class="album-overlay">
                            <h3 class="album-title">${escapeHtml(title)}</h3>
                        </div>
                    </a>
                `;
            });
            grid.innerHTML = html;
        }

        // Fetch Public Albums
        async function fetchAlbums() {
            const grid = document.getElementById('publicGalleryGrid');
            if (!grid) return;
            
            let albums = [];

            try {
                if (typeof db !== 'undefined' && db) {
                    let snapshot;
                    try {
                        snapshot = await db.collection('albums').orderBy('createdAt', 'desc').get();
                    } catch (orderErr) {
                        console.warn("orderBy query failed, attempting standard get():", orderErr);
                        snapshot = await db.collection('albums').get();
                    }

                    if (snapshot && !snapshot.empty) {
                        snapshot.forEach(doc => {
                            albums.push({ id: doc.id, ...doc.data() });
                        });
                    }
                }
            } catch (error) {
                console.warn("Error fetching albums from Firestore:", error);
            }

            // Merge with local storage cache
            const local = JSON.parse(localStorage.getItem('verba_albums')) || [];
            local.forEach(loc => {
                if (!albums.some(a => String(a.id) === String(loc.id) || a.title === loc.title)) {
                    albums.push(loc);
                }
            });

            if (albums.length === 0) {
                showEmptyState();
                return;
            }

            // Client-side sort if createdAt exists
            albums.sort((a, b) => {
                const tA = a.createdAt && a.createdAt.toMillis ? a.createdAt.toMillis() : (new Date(a.createdAt || 0).getTime() || 0);
                const tB = b.createdAt && b.createdAt.toMillis ? b.createdAt.toMillis() : (new Date(b.createdAt || 0).getTime() || 0);
                return tB - tA;
            });

            renderAlbumCards(albums);
        }

        document.addEventListener('DOMContentLoaded', fetchAlbums);
    </script>
</body>
</html>
