<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Welcome to Verba Vitae">
    <title>Verba Vitae - Gallery</title>
    <link rel="icon" type="image/png" href="images/verbavitaelogoblue.png">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome for Social Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <!-- Note: We only need firestore to read public albums, no auth/storage needed for viewing -->
    <script src="js/firebase-init.js"></script>
    <style>
        .embed-mode .main-header,
        .embed-mode .mobile-header-bar,
        .embed-mode .desktop-nav,
        .embed-mode .floating-logo-box,
        .embed-mode .main-footer,
        .embed-mode div[style*="ff9800"] {
            display: none !important;
        }
        .embed-mode body {
            padding-top: 0 !important;
            background-color: #ffffff !important;
        }
    </style>
    <script>
        if (window.location.search.includes('embed=true')) {
            document.documentElement.classList.add('embed-mode');
        }
    </script>
</head>
<body>
    <header class="main-header">
        
        <!-- Mobile Header (Visible only on mobile) -->
        <div class="mobile-header-bar">
            <div class="burger-menu" id="burger-menu">
                <i class="fas fa-bars"></i>
            </div>
            <div class="mobile-logo-container">
                <img src="images/verbavitaelogoblue.png" alt="Verba Vitae" class="mobile-logo-img">
                <span class="mobile-logo-text">VERBA VITAE</span>
            </div>
        </div>
        
        <!-- Mobile Navigation Menu -->
        <div class="mobile-nav" id="mobile-nav">
            <a href="login.html">Log In</a>
            <a href="join.html">Join</a>
            <a href="eboard.html">Our E-Board</a>
            <a href="opportunities.html">Opportunities</a>
            <a href="news.html">News</a>
            <a href="events.html">Events</a>
            <a href="shop.html">Shop</a>
        </div>

        <!-- Desktop Navigation (Visible only on desktop) -->
        <div class="desktop-nav">
            <div class="top-bar">
                <div class="nav-links left-links">
                </div>
                <div class="nav-links right-links" style="justify-content: flex-end; padding-right: 5%;">
                    <a href="login.html" class="btn-login">LOG IN</a>
                </div>
            </div>
            
            <div class="secondary-bar">
                <div class="nav-links left-links">
                    <a href="join.html">Join</a>
                    <span class="divider">|</span>
                    <a href="eboard.html">Our E-Board</a>
                    <span class="divider">|</span>
                    <a href="opportunities.html">Opportunities</a>
                </div>
                <div class="nav-links right-links">
                    <a href="news.html">News</a>
                    <span class="divider">|</span>
                    <a href="events.html">Events</a>
                    <span class="divider">|</span>
                    <a href="shop.html">Shop</a>
                </div>
            </div>
        </div>
    </header>

    <div class="floating-logo-box">
        <a href="index.html" style="text-decoration: none; color: inherit; display: flex; flex-direction: column; align-items: center;">
            <img src="images/verbavitaelogofill.jpg" alt="Verba Vitae Logo" class="logo-img">
            <h1 class="logo-title">VERBA VITAE</h1>
            <p class="logo-subtitle">Organization</p>
        </a>
    </div>

    <!-- Dynamic Gallery Section -->
    <section class="gallery-section" id="gallery-section">
        <h2 class="about-title">ALBUM GALLERY</h2>
        <div class="gallery-grid" id="publicGalleryGrid">
            <!-- Albums will be dynamically injected here -->
        </div>
    </section>

    <footer class="main-footer">
        <div class="footer-container">
            <div class="footer-left">
                <img src="images/verbavitaelogoblue.png" alt="Verba Vitae" class="footer-logo">
            </div>
            
            <div class="footer-center">
                <h4 class="footer-social-title">FOLLOW US</h4>
                <div class="social-icons">
                    <a href="#"><i class="fab fa-facebook-f"></i></a>
                    <a href="#"><i class="fab fa-instagram"></i></a>
                    <a href="#"><i class="fab fa-youtube"></i></a>
                    <a href="#"><i class="fa-brands fa-x-twitter"></i></a>
                    <a href="#"><i class="fab fa-linkedin-in"></i></a>
                    <a href="#"><i class="fab fa-tiktok"></i></a>
                </div>
                <div class="footer-links">
                    &copy; Copyright 2026 Verba Vitae | <a href="#">Privacy Policy</a> | <a href="#">Membership Terms and Conditions</a>
                </div>
            </div>

            <div class="footer-right"></div>
        </div>
    </footer>

    <script>
        // Burger Menu Toggle
        const burgerMenu = document.getElementById('burger-menu');
        const mobileNav = document.getElementById('mobile-nav');
        
        if (burgerMenu && mobileNav) {
            burgerMenu.addEventListener('click', () => {
                mobileNav.classList.toggle('active');
            });
        }

        function showEmptyState() {
            const grid = document.getElementById('publicGalleryGrid');
            if (grid) {
                grid.innerHTML = '<p class="no-events" style="grid-column: 1 / -1; text-align: center; padding: 40px; color: #666; font-size: 1.1rem;">No albums available at the moment.</p>';
            }
        }

        function renderAlbumCards(albums) {
            const grid = document.getElementById('publicGalleryGrid');
            if (!grid) return;

            if (!albums || albums.length === 0) {
                showEmptyState();
                return;
            }

            let html = '';
            albums.forEach(data => {
                const cover = data.coverUrl || 'images/verbavitaelogoblue.png';
                const title = data.title || 'Untitled Album';
                html += `
                    <a href="album.html?id=${data.id}" class="gallery-album-card" style="text-decoration:none; color:inherit; display:block; cursor:pointer;">
                        <img src="${cover}" alt="${title}" class="album-cover" onerror="this.onerror=null; this.src='images/verbavitaelogoblue.png';">
                        <div class="album-overlay">
                            <h3 class="album-title">${title}</h3>
                        </div>
                    </a>
                `;
            });
            grid.innerHTML = html;
        }

        // Fetch Public Albums
        async function fetchAlbums() {
            const grid = document.getElementById('publicGalleryGrid');
            if (!grid) return;
            
            try {
                if (typeof db === 'undefined' || !db) {
                    showEmptyState();
                    return;
                }

                let snapshot;
                try {
                    snapshot = await db.collection('albums').orderBy('createdAt', 'desc').get();
                } catch (orderErr) {
                    console.warn("orderBy query failed, attempting standard get():", orderErr);
                    snapshot = await db.collection('albums').get();
                }

                if (!snapshot || snapshot.empty) {
                    showEmptyState();
                    return;
                }
                
                const albums = [];
                snapshot.forEach(doc => {
                    albums.push({ id: doc.id, ...doc.data() });
                });

                // Client-side sort if createdAt exists
                albums.sort((a, b) => {
                    const tA = a.createdAt && a.createdAt.toMillis ? a.createdAt.toMillis() : (a.createdAt || 0);
                    const tB = b.createdAt && b.createdAt.toMillis ? b.createdAt.toMillis() : (b.createdAt || 0);
                    return tB - tA;
                });

                renderAlbumCards(albums);
            } catch (error) {
                console.error("Error fetching albums:", error);
                showEmptyState();
            }
        }

        document.addEventListener('DOMContentLoaded', fetchAlbums);
    </script>
</body>
</html>
