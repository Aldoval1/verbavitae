<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verba Vitae - Login</title>
    <link rel="icon" type="image/png" href="images/verbavitaelogoblue.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="js/firebase-init.js"></script>
</head>
<body class="login-page-body">
    <div class="login-wrapper">
        <div class="login-container">
            <!-- Left Column: Main Login -->
            <div class="login-main">
                <div class="login-header">
                    <a href="index.html" class="login-logo-link">
                        <img src="images/verbavitaelogoblue.png" alt="Verba Vitae Logo" class="login-logo">
                        <span class="login-title">LOGIN</span>
                    </a>
                </div>

                <form class="login-form" id="loginForm">
                    <div class="form-group">
                        <div class="form-label-row">
                            <label for="username">Username (Email Address)</label>
                            <a href="#" class="forgot-link" id="forgotUsernameLink">Forgot Username?</a>
                        </div>
                        <div class="input-with-icon">
                            <input type="email" id="username" name="username" placeholder="example@gmail.com" required autocomplete="username">
                            <span class="input-icon"><i class="fas fa-user"></i></span>
                        </div>
                    </div>

                    <div class="form-group">
                        <div class="form-label-row">
                            <label for="password">Password</label>
                            <a href="#" class="forgot-link" id="forgotPasswordLink">Forgot Password?</a>
                        </div>
                        <div class="input-with-icon">
                            <input type="password" id="password" name="password" placeholder="Password" required autocomplete="current-password">
                            <span class="input-icon" style="cursor: pointer;" title="Show/Hide Password"><i class="fas fa-eye" id="togglePassword"></i></span>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-signin">Sign In</button>
                    </div>
                    <div id="loginError" style="color: #e53e3e; margin-top: 15px; display: none; font-size: 0.9rem; text-align: center; font-weight: 600;">
                        Invalid email or password.
                    </div>

                    <div class="login-signup-prompt">
                        Don't have an account? <a href="join.html">Create one</a>
                    </div>
                </form>
            </div>

            <!-- Right Column: Extra Info (Empty for now) -->
            <div class="login-sidebar">
                <!-- Empty as requested -->
            </div>
        </div>


    </div>

    <script>
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        if (togglePassword && passwordInput) {
            togglePassword.addEventListener('click', function () {
                const isPassword = passwordInput.getAttribute('type') === 'password';
                passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
                this.classList.toggle('fa-eye');
                this.classList.toggle('fa-eye-slash');
            });
        }

        const forgotUsernameLink = document.getElementById('forgotUsernameLink');
        if (forgotUsernameLink) {
            forgotUsernameLink.addEventListener('click', function (e) {
                e.preventDefault();
                const errorEl = document.getElementById('loginError');
                if (errorEl) {
                    errorEl.style.color = '#2b6cb0';
                    errorEl.textContent = 'Your username is your registered MDC student email or personal email address. If you need assistance locating your account, please contact Verba Vitae administration.';
                    errorEl.style.display = 'block';
                }
            });
        }

        const forgotPasswordLink = document.getElementById('forgotPasswordLink');
        if (forgotPasswordLink) {
            forgotPasswordLink.addEventListener('click', async function (e) {
                e.preventDefault();
                const errorEl = document.getElementById('loginError');
                let email = document.getElementById('username').value.trim().toLowerCase();
                if (!email) {
                    const prompted = prompt('Please enter your registered email address to receive a password reset link:');
                    if (!prompted) return;
                    email = prompted.trim().toLowerCase();
                    document.getElementById('username').value = email;
                }
                if (!email) {
                    if (errorEl) {
                        errorEl.style.color = '#e53e3e';
                        errorEl.textContent = 'Please enter your email address first to reset your password.';
                        errorEl.style.display = 'block';
                    }
                    return;
                }
                try {
                    if (auth) {
                        await auth.sendPasswordResetEmail(email);
                        if (errorEl) {
                            errorEl.style.color = '#2f855a';
                            errorEl.textContent = 'Password reset email sent to ' + email + '. Please check your inbox and spam folder.';
                            errorEl.style.display = 'block';
                        }
                    }
                } catch (resetErr) {
                    console.error('Password reset error:', resetErr);
                    if (errorEl) {
                        errorEl.style.color = '#e53e3e';
                        errorEl.textContent = resetErr.message || 'Could not send password reset email. Please verify your email address.';
                        errorEl.style.display = 'block';
                    }
                }
            });
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('username').value.trim().toLowerCase();
            const pass = document.getElementById('password').value.trim();
            const errorEl = document.getElementById('loginError');
            const submitBtn = e.target.querySelector('.btn-signin');
            errorEl.style.color = '#e53e3e';

            if (!email || !pass) {
                errorEl.textContent = 'Please enter both email and password.';
                errorEl.style.display = 'block';
                return;
            }

            submitBtn.textContent = 'Signing in...';
            submitBtn.disabled = true;

            try {
                // 1. Authenticate with Firebase
                const userCredential = await auth.signInWithEmailAndPassword(email, pass);
                const user = userCredential.user;

                // Save login session flag
                localStorage.setItem('verba_logged_in', 'true');

                // 2. Fetch User Role from Firestore (with strict root admin detection)
                const isAdminEmail = window.isRootAdminEmail ? window.isRootAdminEmail(email) : (email === 'aaronbacallao06@gmail.com' || email.endsWith('@theverbavitae.org'));
                let role = isAdminEmail ? 'admin' : 'member';
                let uData = null;
                
                try {
                    const userDoc = await db.collection('users').doc(user.uid).get();
                    if (userDoc.exists) {
                        uData = userDoc.data();
                        if (uData.status === 'expelled' || uData.role === 'expelled') {
                            await auth.signOut();
                            localStorage.removeItem('verba_logged_in');
                            localStorage.removeItem('verba_user_email');
                            localStorage.removeItem('verba_user_name');
                            errorEl.textContent = 'This account has been expelled from Verba Vitae. Access is revoked. Please contact administration.';
                            errorEl.style.display = 'block';
                            submitBtn.textContent = 'Sign In';
                            submitBtn.disabled = false;
                            return;
                        }
                        if (uData.role) {
                            role = isAdminEmail ? 'admin' : uData.role;
                        }
                    } else if (isAdminEmail) {
                        role = 'admin';
                        // Auto-create user document in Firestore if missing
                        db.collection('users').doc(user.uid).set({
                            email: email,
                            role: 'admin',
                            status: 'active',
                            createdAt: firebase.firestore.FieldValue.serverTimestamp()
                        }, { merge: true }).catch(e => console.warn("Auto-doc creation warning:", e));
                    }
                } catch (roleErr) {
                    console.warn("Could not fetch user role:", roleErr);
                    if (isAdminEmail) {
                        role = 'admin';
                    }
                }

                // Store user identity in localStorage
                localStorage.setItem('verba_user_email', email);
                localStorage.setItem('verba_user_name', uData?.displayName || uData?.firstName || user.displayName || email.split('@')[0]);

                // 3. Redirect based on role
                if (role === 'admin') {
                    window.location.href = 'admin-dashboard.html';
                } else if (role === 'eboard') {
                    window.location.href = 'eboard-dashboard.html';
                } else {
                    window.location.href = 'dashboard.html';
                }

            } catch (error) {
                console.error("Login error:", error);
                if (error.code === 'auth/too-many-requests') {
                    errorEl.textContent = 'Too many attempts. Access is temporarily blocked by Firebase. Please wait 2-3 minutes or try from an Incognito/Private window.';
                } else if (error.code === 'auth/invalid-credential' || error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                    errorEl.innerHTML = 'Incorrect email or password. Don\'t have an account yet? <a href="join.html" style="color: #3182ce; font-weight: bold; text-decoration: underline;">Register here</a>';
                } else {
                    errorEl.textContent = error.message ? error.message : 'Invalid email or password.';
                }
                errorEl.style.display = 'block';
                submitBtn.textContent = 'Sign In';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
