<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verba Vitae - Login</title>
    <link rel="icon" type="image/png" href="verbavitaelogoblue.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="login.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="login-page-body">
    <div class="login-wrapper">
        <div class="login-container">
            <!-- Left Column: Main Login -->
            <div class="login-main">
                <div class="login-header">
                    <a href="index.html" class="login-logo-link">
                        <img src="verbavitaelogoblue.png" alt="Verba Vitae Logo" class="login-logo">
                        <div class="login-title-box">
                            <h1 class="login-title">VERBA VITAE</h1>
                            <p class="login-subtitle">Organization</p>
                        </div>
                    </a>
                </div>

                <form class="login-form" id="loginForm">
                    <div class="form-group">
                        <div class="form-label-row">
                            <label for="username">Username (Email Address)</label>
                            <a href="#" class="forgot-link">Forgot Username?</a>
                        </div>
                        <div class="input-with-icon">
                            <input type="text" id="username" name="username">
                            <span class="input-icon">👤</span>
                        </div>
                    </div>

                    <div class="form-group">
                        <div class="form-label-row">
                            <label for="password">Password</label>
                            <a href="#" class="forgot-link">Forgot Password?</a>
                        </div>
                        <div class="input-with-icon">
                            <input type="password" id="password" name="password">
                            <span class="input-icon">🔒</span>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-signin">Sign In</button>
                    </div>
                    <div id="loginError" style="color: #e53e3e; margin-top: 15px; display: none; font-size: 0.9rem; text-align: center; font-weight: 600;">
                        Invalid credentials. Please use the test account.
                    </div>
                </form>
            </div>

            <!-- Right Column: Extra Info (Empty for now) -->
            <div class="login-sidebar">
                <!-- Empty as requested -->
            </div>
        </div>

        <div class="login-help-text">
            Need help? We have <a href="#">answers</a>. <a href="#">Email us</a>, or call<br>
            <a href="#">800.946.9995</a> between 8:30 am and 5:00 pm CT.
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('username').value.trim().toLowerCase();
            const pass = document.getElementById('password').value;
            const errorEl = document.getElementById('loginError');

            // Simulated Authentication Routing
            if (user && pass) {
                localStorage.setItem('verba_logged_in', 'true');
                localStorage.setItem('verba_user_email', user);
                
                if (user.includes('@verbavitae')) {
                    window.location.href = 'eboard-dashboard.html';
                } else {
                    window.location.href = 'dashboard.html';
                }
            } else {
                errorEl.style.display = 'block';
            }
        });
    </script>
</body>
</html>
