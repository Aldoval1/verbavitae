<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verba Vitae - Login</title>
    <link rel="icon" type="image/png" href="images/verbavitaelogoblue.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="js/firebase-init.js"></script>
</head>
<body class="login-page-body">
    <div class="login-wrapper">
        <div class="login-container">
            <!-- Left Column: Main Login -->
            <div class="login-main">
                <div class="login-header">
                    <a href="index.html" class="login-logo-link">
                        <img src="images/verbavitaelogoblue.png" alt="Verba Vitae Logo" class="login-logo">
                        <div class="login-title-box">
                            <h1 class="login-title">VERBA VITAE</h1>
                            <p class="login-subtitle">Organization</p>
                        </div>
                    </a>
                </div>

                <form class="login-form" id="loginForm">
                    <div class="form-group">
                        <div class="form-label-row">
                            <label for="username">Username (Email Address)</label>
                            <a href="#" class="forgot-link">Forgot Username?</a>
                        </div>
                        <div class="input-with-icon">
                            <input type="text" id="username" name="username">
                            <span class="input-icon">ðŸ‘¤</span>
                        </div>
                    </div>

                    <div class="form-group">
                        <div class="form-label-row">
                            <label for="password">Password</label>
                            <a href="#" class="forgot-link">Forgot Password?</a>
                        </div>
                        <div class="input-with-icon">
                            <input type="password" id="password" name="password">
                            <span class="input-icon">ðŸ”’</span>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-signin">Sign In</button>
                    </div>
                    <div id="loginError" style="color: #e53e3e; margin-top: 15px; display: none; font-size: 0.9rem; text-align: center; font-weight: 600;">
                        Invalid credentials. Please use the test account.
                    </div>
                </form>
            </div>

            <!-- Right Column: Extra Info (Empty for now) -->
            <div class="login-sidebar">
                <!-- Empty as requested -->
            </div>
        </div>


    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('username').value.trim().toLowerCase();
            const pass = document.getElementById('password').value;
            const errorEl = document.getElementById('loginError');
            const submitBtn = e.target.querySelector('.btn-signin');

            if (!email || !pass) {
                errorEl.textContent = 'Please enter both email and password.';
                errorEl.style.display = 'block';
                return;
            }

            submitBtn.textContent = 'Signing in...';
            submitBtn.disabled = true;

            try {
                // 1. Authenticate with Firebase
                const userCredential = await auth.signInWithEmailAndPassword(email, pass);
                const user = userCredential.user;

                // 2. Fetch User Role from Firestore
                const userDoc = await db.collection('users').doc(user.uid).get();
                
                if (userDoc.exists) {
                    const userData = userDoc.data();
                    const role = userData.role;

                    // 3. Redirect based on role
                    if (role === 'admin') {
                        window.location.href = 'admin-dashboard.html';
                    } else if (role === 'eboard') {
                        window.location.href = 'eboard-dashboard.html';
                    } else {
                        window.location.href = 'dashboard.html';
                    }
                } else {
                    // Fallback if user doesn't have a Firestore document
                    window.location.href = 'dashboard.html';
                }

            } catch (error) {
                console.error("Login error:", error);
                errorEl.textContent = 'Invalid email or password.';
                errorEl.style.display = 'block';
                submitBtn.textContent = 'Sign In';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
